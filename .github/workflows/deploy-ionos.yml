name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mgd-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      IONOS_HOST: ${{ secrets.IONOS_HOST }}
      IONOS_USER: ${{ secrets.IONOS_USER }}
      IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
      IONOS_TARGET_DIR: ${{ secrets.IONOS_TARGET_DIR }}
      IONOS_PORT: ${{ secrets.IONOS_PORT }}

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in IONOS_HOST IONOS_USER IONOS_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          test -f .htaccess
          test -f assets/css/styles.css
          test -f assets/js/site.js
          node --check assets/js/site.js
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('.')
          errors = []
          html_files = list(root.rglob('*.html'))
          attr_re = re.compile(r'''(?:src|href)=["']([^"']+)["']''', re.I)

          for html in html_files:
              text = html.read_text(encoding='utf-8')
              if '<title>' not in text.lower():
                  errors.append(f'{html}: missing title')
              for ref in attr_re.findall(text):
                  if ref.startswith(('http://','https://','mailto:','tel:','#','data:','javascript:')):
                      continue
                  clean = ref.split('#',1)[0].split('?',1)[0]
                  if not clean:
                      continue
                  target = (html.parent / clean).resolve()
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'{html}: missing local reference {ref}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(html_files)} HTML files with no missing local references.')
          PY

      - name: Stage production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          rsync -a ./ deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'deploy/' \
            --exclude 'README.md' \
            --exclude '.DS_Store'

      - name: Install SFTP client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy to IONOS over SFTP
        shell: bash
        run: |
          set -euo pipefail
          PORT="${IONOS_PORT:-22}"
          TARGET="${IONOS_TARGET_DIR:-.}"
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$IONOS_USER","$IONOS_PASSWORD" -p "$PORT" sftp://$IONOS_HOST
          cd "$TARGET"
          mirror --reverse --delete --verbose --parallel=4 --exclude-glob .well-known/** deploy/ ./
          bye
          EOF

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error --location --max-time 30 https://mgdskidloader.com/ > /tmp/mgd-home.html
          grep -qi 'MGD Skid Loader Services' /tmp/mgd-home.html
          curl --fail --silent --show-error --location --max-time 30 https://mgdskidloader.com/services/ > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://mgdskidloader.com/robots.txt > /dev/null
          curl --fail --silent --show-error --location --max-time 30 https://mgdskidloader.com/sitemap.xml > /dev/null
          echo 'Production smoke test passed.'
